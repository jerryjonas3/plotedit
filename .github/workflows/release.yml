# Build a download that someone who is not a developer can actually run.
#
# ⭐ The whole point is that the zip contains web/dist ALREADY BUILT, so the
# person unzipping it needs Python and nothing else. A git clone needs Node as
# well, which is one install too many for a lighting designer who wants to draw
# a plot.
#
# ⚠ The tests run first and the release is not built if they fail. A download
# that is broken is worse than no download: it is a first impression that cannot
# be taken back.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
        working-directory: web

      - name: Tests — Python
        run: |
          cd server
          for f in test_*.py; do echo "--- $f"; python "$f"; done
          python verify_suites.py

      - name: Tests — web
        run: |
          cd web
          npx tsc --noEmit
          npm run test:all

      - name: Build the editor
        run: npm run build
        working-directory: web

      - name: Assemble the download
        run: |
          mkdir -p out/plotedit
          cp -r server samples docs run.command run.bat README.md out/plotedit/
          chmod +x out/plotedit/run.command
          mkdir -p out/plotedit/web
          cp -r web/dist out/plotedit/web/dist
          # ⚠ Nothing that only a developer needs: no node_modules, no tests'
          # fixtures beyond what the app reads, no .git.
          find out/plotedit -name '__pycache__' -type d -prune -exec rm -rf {} +
          cd out && zip -qr ../plotedit.zip plotedit

      - uses: actions/upload-artifact@v4
        with:
          name: plotedit
          path: plotedit.zip

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plotedit.zip
